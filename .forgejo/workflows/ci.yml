name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION_OLDEST: "2.0.6"
  FLUTTER_VERSION_NEWEST: "3.38.7"

jobs:
  test:
    name: Test (newest Flutter version)
    runs-on: codeberg-small

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.forgejo/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION_NEWEST }}

      - name: Dependencies
        run: dart pub get
      - name: Check format
        run: dart format --set-exit-if-changed lib bin test
      - name: Test
        run: dart test

  test_legacy:
    name: Test (oldest Flutter version)
    runs-on: codeberg-small

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.forgejo/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION_OLDEST }}

      - name: Dependencies
        run: dart pub get
      - name: Test
        run: dart test
